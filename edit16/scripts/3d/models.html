<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=900;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,W); r.localClippingEnabled=true; r.setPixelRatio(1); r.setClearColor(0x000000,0);
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=0.85; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; scene.environmentIntensity=0.7;
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(3,5,4); scene.add(key);
const rim=new THREE.DirectionalLight(0xbfe8d0,1.2); rim.position.set(-4,2,-3); scene.add(rim);
const cam=new THREE.PerspectiveCamera(28,1,0.1,100);
const GREEN=0x0F7A3C;
const rubber=new THREE.MeshPhysicalMaterial({color:0x161616,roughness:0.55,metalness:0.0,clearcoat:0.35,clearcoatRoughness:0.5});
const chrome=new THREE.MeshPhysicalMaterial({color:0xdadada,roughness:0.18,metalness:1.0});
const knurl=new THREE.MeshPhysicalMaterial({color:0xbdbdbd,roughness:0.45,metalness:1.0});
const greenPaint=new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.38,metalness:0.05,clearcoat:1,clearcoatRoughness:0.2});
const greenRubber=new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.6,metalness:0,clearcoat:0.2});
const cyl=(rt,rb,h,seg,m)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);
function dumbbell(){const g=new THREE.Group();
  const h=cyl(0.085,0.085,1.5,48,knurl); h.rotation.z=Math.PI/2; g.add(h);
  for(const s of[-1,1]){
    const head=cyl(0.44,0.44,0.56,6,rubber); head.rotation.z=Math.PI/2; head.position.x=s*1.0; g.add(head);
    const col=cyl(0.17,0.17,0.12,48,chrome); col.rotation.z=Math.PI/2; col.position.x=s*0.66; g.add(col);
    const cap=cyl(0.2,0.2,0.05,48,chrome); cap.rotation.z=Math.PI/2; cap.position.x=s*1.3; g.add(cap);
    const em=cyl(0.13,0.13,0.06,48,greenPaint); em.rotation.z=Math.PI/2; em.position.x=s*1.31; g.add(em);
  } return g;}
function kettlebell(){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.85,96,96),greenPaint); body.scale.set(1,0.93,1); g.add(body);
  const base=cyl(0.5,0.5,0.06,64,greenPaint); base.position.y=-0.79; g.add(base);
  const tor=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.12,32,96,Math.PI),greenPaint); tor.position.y=0.78; g.add(tor);
  for(const s of[-1,1]){const p=cyl(0.12,0.15,0.34,32,greenPaint); p.position.set(s*0.5,0.66,0); p.rotation.z=s*0.12; g.add(p);}
  const band=new THREE.Mesh(new THREE.TorusGeometry(0.86,0.02,16,128),chrome); band.rotation.x=Math.PI/2; band.position.y=-0.1; band.scale.set(1,1,1); g.add(band);
  return g;}
function plate(){const g=new THREE.Group(); const sh=new THREE.Shape(); sh.absarc(0,0,1,0,Math.PI*2,false);
  const hole=new THREE.Path(); hole.absarc(0,0,0.13,0,Math.PI*2,true); sh.holes.push(hole);
  for(const a of[90,210,330]){const rad=a*Math.PI/180; const p=new THREE.Path(); p.absellipse(Math.cos(rad)*0.66,Math.sin(rad)*0.66,0.19,0.09,0,Math.PI*2,true,rad+Math.PI/2); sh.holes.push(p);}
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.26,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.035,bevelSegments:6,curveSegments:96}); geo.center();
  g.add(new THREE.Mesh(geo,greenRubber));
  const hub=cyl(0.24,0.24,0.4,64,chrome); hub.rotation.x=Math.PI/2; g.add(hub);
  const inner=cyl(0.135,0.135,0.42,48,new THREE.MeshStandardMaterial({color:0x111111})); inner.rotation.x=Math.PI/2; g.add(inner);
  return g;}
function shaker(){const g=new THREE.Group();
  const body=cyl(0.46,0.38,1.45,96,greenPaint); g.add(body);
  const cap=cyl(0.48,0.48,0.36,96,rubber); cap.position.y=0.9; g.add(cap);
  const top=cyl(0.36,0.48,0.1,96,rubber); top.position.y=1.13; g.add(top);
  const sp=cyl(0.09,0.12,0.16,48,rubber); sp.position.set(0.15,1.25,0); g.add(sp);
  const loop=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.045,16,64),rubber); loop.position.set(-0.28,1.24,0); loop.rotation.y=Math.PI/2; g.add(loop);
  return g;}

const ink=new THREE.MeshPhysicalMaterial({color:0x151515,roughness:0.6,clearcoat:0.3});
const paper=new THREE.MeshStandardMaterial({color:0xF4EFE4,roughness:0.9});
const gold=new THREE.MeshPhysicalMaterial({color:0xE0A93A,roughness:0.35,metalness:0.6});
function cap(){const g=new THREE.Group();
  const board=new THREE.Mesh(new RoundedBoxGeometry(2.4,0.08,2.4,4,0.03),ink); board.rotation.y=Math.PI/4; board.position.y=0.55; g.add(board);
  const crown=cyl(0.78,0.7,0.62,96,ink); crown.position.y=0.22; g.add(crown);
  const button=cyl(0.09,0.09,0.06,32,gold); button.position.y=0.62; g.add(button);
  const cordGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,0.62,0),new THREE.Vector3(0.6,0.61,0.15),new THREE.Vector3(1.05,0.58,0.3),new THREE.Vector3(1.12,0.2,0.33)]),40,0.025,8);
  g.add(new THREE.Mesh(cordGeo,gold));
  const tassel=cyl(0.03,0.09,0.42,24,gold); tassel.position.set(1.12,-0.02,0.33); g.add(tassel);
  return g;}
function books(){const g=new THREE.Group(); const cols=[0x0F7A3C,0x151515,0xE8E1D2,0x0F7A3C];
  let y=-0.6; [[2.0,0.34,1.45,0.10],[1.85,0.3,1.35,-0.12],[1.95,0.36,1.4,0.18],[1.7,0.28,1.25,-0.05]].forEach(([w,h,d,r],i)=>{
    const b=new THREE.Group(); const cover=new THREE.MeshPhysicalMaterial({color:cols[i],roughness:0.45,clearcoat:0.5});
    const t=0.05;
    for(const sy of[-1,1]){const pl=new THREE.Mesh(new RoundedBoxGeometry(w,t,d,3,0.02),cover); pl.position.y=sy*(h/2-t/2); b.add(pl);}
    const spine=new THREE.Mesh(new RoundedBoxGeometry(0.08,h,d,3,0.03),cover); spine.position.x=-w/2+0.04; b.add(spine);
    const pg=new THREE.Mesh(new THREE.BoxGeometry(w*0.95,h-2*t,d*0.94),paper); pg.position.x=0.0; b.add(pg);
    const band=new THREE.Mesh(new THREE.BoxGeometry(0.05,h*1.01,d*1.01),gold); band.position.x=-w*0.3; b.add(band);
    b.position.y=y+h/2; b.rotation.y=r; g.add(b); y+=h;});
  return g;}
function pencil(){const g=new THREE.Group();
  const body=cyl(0.16,0.16,2.6,6,new THREE.MeshPhysicalMaterial({color:0x1F9D55,roughness:0.4,clearcoat:0.6})); g.add(body);
  const wood=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.45,6),new THREE.MeshStandardMaterial({color:0xE9C99A,roughness:0.8})); wood.position.y=-1.525; wood.rotation.x=Math.PI; g.add(wood);
  const lead=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.16,24),new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.5})); lead.position.y=-1.7; lead.rotation.x=Math.PI; g.add(lead);
  const fer=cyl(0.17,0.17,0.26,32,chrome); fer.position.y=1.43; g.add(fer);
  const er=cyl(0.16,0.16,0.26,32,new THREE.MeshStandardMaterial({color:0xF08A9B,roughness:0.7})); er.position.y=1.69; g.add(er);
  return g;}

const enamel=new THREE.MeshPhysicalMaterial({color:0xF7F4EC,roughness:0.22,metalness:0,clearcoat:1,clearcoatRoughness:0.12,sheen:0.3});
function tooth(){const sh=new THREE.Shape();
  sh.moveTo(-0.55,-1.35);
  sh.bezierCurveTo(-0.75,-0.9,-0.95,-0.3,-0.98,0.25);
  sh.bezierCurveTo(-1.02,0.85,-0.75,1.15,-0.42,1.15);
  sh.bezierCurveTo(-0.2,1.15,-0.1,1.02,0,0.98);
  sh.bezierCurveTo(0.1,1.02,0.2,1.15,0.42,1.15);
  sh.bezierCurveTo(0.75,1.15,1.02,0.85,0.98,0.25);
  sh.bezierCurveTo(0.95,-0.3,0.75,-0.9,0.55,-1.35);
  sh.bezierCurveTo(0.45,-1.55,0.25,-1.5,0.2,-1.2);
  sh.bezierCurveTo(0.15,-0.8,0.1,-0.45,0,-0.42);
  sh.bezierCurveTo(-0.1,-0.45,-0.15,-0.8,-0.2,-1.2);
  sh.bezierCurveTo(-0.25,-1.5,-0.45,-1.55,-0.55,-1.35);
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.45,bevelEnabled:true,bevelThickness:0.28,bevelSize:0.16,bevelSegments:16,curveSegments:64}); geo.center();
  const g=new THREE.Group(); g.add(new THREE.Mesh(geo,enamel)); return g;}
function capsule(){const g=new THREE.Group();
  const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.42,0.9,24,64),new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.25,clearcoat:1,clearcoatRoughness:0.1}));
  a.geometry.translate(0,0,0); const half=(geo,keepTop)=>{}; 
  const top=new THREE.Mesh(new THREE.CapsuleGeometry(0.42,0.9,24,64),new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.25,clearcoat:1,clearcoatRoughness:0.1,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,1,0),0)]}));
  const bot=new THREE.Mesh(new THREE.CapsuleGeometry(0.43,0.9,24,64),new THREE.MeshPhysicalMaterial({color:0xF7F4EC,roughness:0.25,clearcoat:1,clearcoatRoughness:0.1,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,-1,0),0.02)]}));
  g.add(top); g.add(bot); g.rotation.z=0.9; const w=new THREE.Group(); w.add(g); return w;}
function toothbrush(){const g=new THREE.Group();
  const handle=new THREE.Mesh(new RoundedBoxGeometry(0.34,3.2,0.24,6,0.12),new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.3,clearcoat:1})); handle.position.y=-0.6; g.add(handle);
  const grip=new THREE.Mesh(new RoundedBoxGeometry(0.36,1.0,0.26,6,0.12),new THREE.MeshPhysicalMaterial({color:0xF7F4EC,roughness:0.6})); grip.position.y=-1.3; g.add(grip);
  const head=new THREE.Mesh(new RoundedBoxGeometry(0.4,0.9,0.18,6,0.08),new THREE.MeshPhysicalMaterial({color:GREEN,roughness:0.3,clearcoat:1})); head.position.y=1.35; g.add(head);
  const bm=new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.7}); const bm2=new THREE.MeshStandardMaterial({color:0x8FD3B0,roughness:0.7});
  for(let r=0;r<7;r++)for(let c=0;c<3;c++){const b=cyl(0.045,0.045,0.32,10,(r+c)%3===0?bm2:bm); b.rotation.x=Math.PI/2; b.position.set(-0.11+c*0.11,1.0+r*0.11,0.25); g.add(b);}
  g.rotation.z=-0.55; const w=new THREE.Group(); w.add(g); return w;}

const kraft=new THREE.MeshStandardMaterial({color:0xC89A62,roughness:0.85});
const tape=new THREE.MeshPhysicalMaterial({color:0xB07A3C,roughness:0.35,clearcoat:0.6});
function bag(){const g=new THREE.Group();
  const paperG=new THREE.MeshPhysicalMaterial({color:0x14874A,roughness:0.55,clearcoat:0.25});
  const body=new THREE.Mesh(new RoundedBoxGeometry(1.7,2.0,0.9,4,0.04),paperG); g.add(body);
  const fold=new THREE.Mesh(new RoundedBoxGeometry(1.72,0.12,0.92,3,0.03),new THREE.MeshPhysicalMaterial({color:0x0F6E3B,roughness:0.6})); fold.position.y=0.94; g.add(fold);
  const rope=new THREE.MeshStandardMaterial({color:0xF2EBDD,roughness:0.7});
  for(const z of[-0.3,0.3]){const h=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.04,16,64,Math.PI),rope); h.position.set(0,1.0,z); g.add(h);}
  const tag=new THREE.Mesh(new RoundedBoxGeometry(0.9,0.5,0.02,3,0.02),new THREE.MeshStandardMaterial({color:0xF7F3EA,roughness:0.6})); tag.position.set(0,0.1,0.46); g.add(tag);
  const dot=cyl(0.09,0.09,0.03,32,paperG); dot.rotation.x=Math.PI/2; dot.position.set(-0.25,0.1,0.48); g.add(dot);
  const ln=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.06,0.02),new THREE.MeshStandardMaterial({color:0x2a2a2a})); ln.position.set(0.12,0.16,0.48); g.add(ln);
  const ln2=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.05,0.02),new THREE.MeshStandardMaterial({color:0x9a948c})); ln2.position.set(0.07,0.03,0.48); g.add(ln2);
  return g;}
function parcel(){const g=new THREE.Group();
  const box=new THREE.Mesh(new RoundedBoxGeometry(2.0,1.3,1.5,4,0.05),kraft); g.add(box);
  const t1=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.02,1.52),tape); t1.position.y=0.66; g.add(t1);
  const t2=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.5,0.02),tape); t2.position.set(0,0.42,0.76); g.add(t2);
  const lab=new THREE.Mesh(new RoundedBoxGeometry(0.75,0.5,0.02,3,0.02),new THREE.MeshStandardMaterial({color:0xFBF8F1,roughness:0.6})); lab.position.set(0.55,-0.15,0.76); g.add(lab);
  for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(0.5-i*0.1,0.05,0.02),new THREE.MeshStandardMaterial({color:i?0x9a948c:0x151515})); l.position.set(0.5-i*0.05,-0.03-i*0.1,0.775); g.add(l);}
  const gl=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,0.02),new THREE.MeshStandardMaterial({color:0x1F9D55})); gl.position.set(0.82,-0.3,0.775); g.add(gl);
  return g;}
const MAKERS={dumbbell,kettlebell,plate,shaker,cap,books,pencil,tooth,capsule,toothbrush,bag,parcel};
const VIEW={bag:[0,1.2,7.2],parcel:[0,1.6,6.6],tooth:[0,0.3,10.5],capsule:[0,0.3,5.2],toothbrush:[0,0.0,8.6],cap:[0,2.9,7.4],books:[0,1.2,5.6],pencil:[0,0.2,7.4],dumbbell:[0,0.9,5.9],kettlebell:[0,1.0,5.6],plate:[0,0.3,5.0],shaker:[0,0.8,5.7]};
let obj=null;
window.setup=(name)=>{if(obj)scene.remove(obj); obj=MAKERS[name](); scene.add(obj); const v=VIEW[name]; cam.position.set(...v); cam.lookAt(0,name==='shaker'?0.2:0,0);};
window.shot=(rx,ry,rz)=>{obj.rotation.set(rx,ry,rz); r.render(scene,cam); return r.domElement.toDataURL('image/png');};
window.ready=true;
</script></body></html>
